- hosts: localhost
  gather_facts: no
  tasks:
    - name: Display KUBRCONFIG environment variable
      ansible.builtin.debug:
        msg: "'{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}' is the KUBECONFIG environment variable."
    - name: Get kubernetes nodes
      shell: kubectl get nodes
      register: ps
    - debug: var=ps.stdout_lines