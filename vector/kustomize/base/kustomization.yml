#apiVersion: kustomize.config.k8s.io/v1beta1
#kind: Kustomization
#resources:
#- all.yml
#patchesStrategicMerge:
#- patch-vector-sources-configmap.yml
#- patch-vector-sinks-configmap.yml

generators:
  - helmChart.yml

configMapGenerator:
  - name: vector-sources
    namespace: vector
    files:
      - ./configs/sources/http_server_data_in.yml
    options:
      disableNameSuffixHash: true
  - name: vector-transforms
    namespace: vector
    files:
      - ./configs/transforms/http_server_data_in_remap.yml
      - ./configs/transforms/http_server_data_in_route.yml
      - ./configs/transforms/sensor_remap_in.yml
      - ./configs/transforms/sensor_route_in.yml
    options:
      disableNameSuffixHash: true
  - name: vector-sinks
    namespace: vector
    files:
      - ./configs/sinks/console.yml
    options:
      disableNameSuffixHash: true

resources:
  - namespace.yml
  - kafka-credentials-for-vector.yml