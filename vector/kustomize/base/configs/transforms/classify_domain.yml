type: remap
inputs:
  - http_server_data_in
source: |
  # 1. Path Parsing (Cleaned up from our previous step)
  path_str = to_string!(.path)
  clean_path = strip_whitespace(path_str)
  if length(clean_path) > 1 {
      # Remove leading slash and split
      .path_parts = split(slice!(clean_path, 1), "/")
  }
  .event_domain = get(.path_parts, [0]) ?? "unknown"

  # 2. Payload to Message Swap
  # If iOS sends {"payload": {"name": "...", "timestamp": ...}}
  if exists(.payload) {
      .message = del(.payload) 
  } 

  # 3. Fallback: If there was no payload but a raw body exists
  if .message == null || .message == "" {
      .message = {}
  } else {
      # Ensure it is parsed JSON if it came in as a string
      .message = parse_json(.message) ?? .message
  }