type: remap
inputs:
  - http_server_data_in
source: |
  # 1. Hard validation: Require timestamp from iOS
  if !exists(.timestamp) { 
      log("Missing timestamp. Dropping.", level: "error")
      abort 
  }
  .timestamp = to_int!(.timestamp)

  # 2. Path separation
  # Path: /sensor/shortcut/event_name
  path_parts = split(strip_whitespace!(.path), "/", limit: 2)
  # Use .get() which returns null if out of bounds, then ?? handles the null
  .event_domain = get(path_parts, [1]) ?? "unknown_domain"
            
  # 3. Mes  sage standardization
  # If the   body is JSON, parse it into an object. 
  # If emp  ty/null, make it an empty object.
  if .message == null {
      .message = {}
  } else {
      .message = parse_json(.message) ?? .message
  }