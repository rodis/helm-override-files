type: remap
inputs:
  - http_server_data_in
source: |
  # 1. Hard validation: Require timestamp from iOS
  if !exists(.timestamp) { 
      log("Missing timestamp. Dropping.", level: "error")
      abort 
  }
  .timestamp = to_int!(.timestamp)

  # 2. Path separation
  # Remove leading and trailing slashes so " /sensor/shortcut/ " becomes "sensor/shortcut"
  clean_path = strip_whitespace!(.path)
  clean_path = replace(clean_path, r'^/+', "") 

  # Split the cleaned path
  .path_parts = split(clean_path, "/", limit: 0)

  # Now index 0 is 'sensor', index 1 is 'shortcut', etc.
  .event_domain = get(.path_parts, [0]) ?? "unknown_domain"

  # 3. Mes  sage standardization
  # If the   body is JSON, parse it into an object. 
  # If emp  ty/null, make it an empty object.
  if .message == null {
      .message = {}
  } else {
      .message = parse_json(.message) ?? .message
  }