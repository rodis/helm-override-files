type: remap
inputs:
  - http_server_data_in
source: |
  # 1. Hard validation: Require timestamp from iOS
  if !exists(.timestamp) { 
      log("Missing timestamp. Dropping.", level: "error")
      abort 
  }
  .timestamp = to_int!(.timestamp)

  # 2. Path separation
  # Ensure it's a string, trim it, and remove the leading slash
  raw_path = to_string!(.path)
  clean_path = strip_whitespace(raw_path)
  clean_path = slice!(clean_path, 1) # Removes the first character (the '/')

  # Split without a limit to get everything
  .path_parts = split(clean_path, "/")

  # Now, let's verify index 0
  .event_domain = get(.path_parts, [0]) ?? "unknown_domain"

  # 3. Mes  sage standardization
  # If the   body is JSON, parse it into an object. 
  # If emp  ty/null, make it an empty object.
  if .message == null {
      .message = {}
  } else {
      .message = parse_json(.message) ?? .message
  }