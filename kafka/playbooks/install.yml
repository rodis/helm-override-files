- hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Create a Kafka namespace
      kubernetes.core.k8s:
        name: kafka
        api_version: v1
        kind: Namespace
        state: present
    - name: Install kafka credential secret
      kubernetes.core.k8s:
        state: present
        src: ../kafka-sasl-credentials.yml
        apply: true
    - name: Install Kafka from Helm and kustomize
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('kubernetes.core.kustomize', dir=playbook_dir + '/..', binary_path='/usr/bin/kustomize', enable_helm=True) }}"
