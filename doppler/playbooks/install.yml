
- name: Install doppler secrets operator
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    # An unset variable reads as '' and would be written into the cluster as an empty token: the
    # task succeeds, the operator starts, and every DopplerSecret fails later and elsewhere. Fail
    # here instead, where the cause is still obvious.
    - name: Refuse to run without a Doppler token
      ansible.builtin.assert:
        that: lookup('env', 'DOPPLER_TOKEN_SECRET') | length > 0
        fail_msg: DOPPLER_TOKEN_SECRET is not set; the operator would be installed with an empty token.
        quiet: true
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: doppler
      register: doppler_operator_dir
      # Runner-local scratch, not the cluster. It must run in check mode or every later
      # task that references its .path fails on an undefined variable and the whole plan
      # dies before reaching anything that touches Kubernetes. The k8s tasks below are
      # deliberately NOT marked, so in check mode they do a server-side dry run -- which is
      # the actual plan.
      check_mode: false
    - name: Compose path
      set_fact:
        doppler_operator_manifest_path: "{{ doppler_operator_dir.path }}/doppler-secrets-operator.yaml"
    # Pinned: `latest` meant each cluster got whatever was current on the day it was built.
    # v1.7.1 is what both production and infra run (read 2026-09-26).
    - name: Download doppler secrets operator manifest
      ansible.builtin.get_url:
        url: https://github.com/DopplerHQ/kubernetes-operator/releases/download/v1.7.1/recommended.yaml
        dest: "{{ doppler_operator_manifest_path }}"
        mode: '0664'
      check_mode: false   # runner-local scratch; see above
    # The kustomization edits the downloaded manifest before anything is applied: leader election
    # off, Recreate strategy. See the comments in ../kustomization.yml for why.
    - name: Copy the kustomization next to the downloaded manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../kustomization.yml"
        dest: "{{ doppler_operator_dir.path }}/kustomization.yml"
        mode: '0644'
      check_mode: false   # runner-local scratch; see above
    - name: Apply doppler manifest to the cluster.
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('kubernetes.core.kustomize', dir=doppler_operator_dir.path, binary_path='/usr/bin/kustomize') }}"
    - name: Create Doppler Secret Token
      # The module returns the object it applied, data included, so without this the token lands
      # in the run log -- which on Spacelift is kept in run history.
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: doppler-token-secret
            namespace: doppler-operator-system
          type: Opaque
          data:
            serviceToken: "{{ lookup('env', 'DOPPLER_TOKEN_SECRET') | b64encode }}"