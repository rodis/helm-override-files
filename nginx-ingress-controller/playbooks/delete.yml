# Removes the bitnami nginx controller, and only the controller.
#
# The IngressClass `nginx` is deliberately LEFT IN PLACE. Traefik's kubernetesIngressNginx
# provider serves Ingresses of that class, so the class is the contract every Ingress on the
# cluster (AWX's, and cert-manager's HTTP-01 solvers) is written against -- deleting it here would
# take routing down with the controller even with Traefik already running. traefik/ re-applies it
# anyway, but nothing should depend on the order the two playbooks happen to run in.
#
# Run it only once Traefik is serving: removing the Service is what releases the externalIP
# that has been capturing :80/:443 on the control-plane address. See traefik/INFRA-CUTOVER.md.
- hosts: localhost
  become: false
  gather_facts: false
  tasks:
    # helmChart.yml names generated-values.yml as an additional values file, and kustomize fails
    # if it is missing. Its content only feeds externalIPs, which do not change any resource's
    # name or kind, so an empty file renders the same set of objects to delete.
    - name: Provide the additional values file the chart expects
      ansible.builtin.copy:
        content: "{}\n"
        dest: "{{ playbook_dir }}/../generated-values.yml"
        mode: "0644"
      check_mode: false   # runner-local scratch

    - name: Render the controller's resources
      ansible.builtin.set_fact:
        nginx_controller_resources: >-
          {{ lookup('kubernetes.core.kustomize', dir=playbook_dir + '/..', binary_path='/usr/bin/kustomize', enable_helm=True)
             | from_yaml_all | select | rejectattr('kind', 'equalto', 'IngressClass') | list }}

    - name: Show what will be removed
      ansible.builtin.debug:
        msg: "{{ nginx_controller_resources | map(attribute='kind') | zip(nginx_controller_resources | map(attribute='metadata.name')) | map('join', '/') | list }}"

    - name: Refuse if the render came back empty
      ansible.builtin.assert:
        that: nginx_controller_resources | length > 0
        fail_msg: >-
          The chart rendered no resources, so this run would delete nothing and report success.
          An empty delete is not a completed removal.

    - name: Delete the controller
      kubernetes.core.k8s:
        state: absent
        namespace: nginx-ingress-controller
        definition: "{{ nginx_controller_resources }}"
        wait: true

    - name: Delete the namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: nginx-ingress-controller
        wait: true

    - name: Remove the generated values file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../generated-values.yml"
        state: absent
      check_mode: false
