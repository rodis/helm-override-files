apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: awx-admin-password
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: awx-admin-secret-key
  config: prd
  nameTransformer: lower-snake
  secrets:
    - PASSWORD
  managedSecret:
    name: awx-admin-password
    namespace: awx
    type: Opaque