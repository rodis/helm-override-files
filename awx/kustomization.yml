apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
  - awx.yml

# Set the image tags to match the git version from above
images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1
  # kube-rbac-proxy comes from upstream's config/default base, which still names the Google-hosted
  # MIRROR gcr.io/kubebuilder. That mirror has been withdrawn: the manifest 404s, and containerd
  # reports `failed to resolve image: not found`. quay.io/brancz is the project's own registry and
  # the source the mirror copied from; same v0.15.0, same digest lineage.
  #
  # Found 2026-10-15 when k8s-south-master-2 joined: the operator had been running for 18 days only
  # because node-1's containerd had the image cached from before the withdrawal, so it started
  # nowhere else. Nothing in the estate had noticed, because nothing re-pulls an image it already
  # has -- an image can stop existing and a cluster keeps working until the first reschedule.
  # Destroying the last node holding the cache would have made the operator unstartable estate-wide.
  #
  # Only the operator's own metrics sit behind this proxy, on 8443, and nothing scrapes them: the
  # alloy config scrapes AWX's APPLICATION metrics at infra.rods.me/api/v2/metrics from outside the
  # cluster, and there are no ServiceMonitor/PodMonitor CRDs installed at all. It is kept rather
  # than deleted because repointing is the smaller change and keeps a future operator bump a clean
  # diff against upstream.
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
    newTag: v0.15.0

# Specify a custom namespace in which to install AWX
namespace: awx

# Leader election timings for the operator, raised from ansible-operator's 15s/10s. It was losing its
# lease -- and restarting -- about twice a day (1,066 restarts), whenever an etcd fsync stalled for
# longer than the 10s renew deadline; see cert-manager/values.yml and infra-objectives/CLAUDE.md,
# "What the substrate does to the control plane". The flags exist in the 2.19.1 image's
# ansible-operator (checked with `ansible-operator run --help` in the running pod, 2026-09-26);
# there is no retry-period flag, so that stays at its 2s default.
#
# INLINE, not a patch file: playbooks/install.yml copies only this file and awx.yml into the operator
# checkout, so a separate patch file would silently never be applied.
#
# A strategic merge replaces the container's whole args list. The first four are upstream's own
# (config/default at 2.19.1), copied verbatim -- re-check them whenever the operator version moves.
patches:
  - target:
      kind: Deployment
      name: awx-operator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: awx-operator-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: awx-manager
                args:
                  - --health-probe-bind-address=:6789
                  - --metrics-bind-address=127.0.0.1:8080
                  - --leader-elect
                  - --leader-election-id=awx-operator
                  - --leader-elect-lease-duration=90s
                  - --leader-elect-renew-deadline=60s
