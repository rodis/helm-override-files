config:
  kafka:
    brokers:
      - kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9092
      - kafka-broker-1.kafka-broker-headless.kafka.svc.cluster.local:9092
      - kafka-broker-2.kafka-broker-headless.kafka.svc.cluster.local:9092
    sasl:
      enabled: true
extraEnvFrom:
  - secretRef:
      name: kafka-sasl-credentials
tests:
  enabled: false
secret:
  create: false
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: --placeholder--
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: redpanda-tls
      hosts:
        - --placeholder--
