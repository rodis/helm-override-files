# https://github.com/community-charts/helm-charts/blob/main/charts/n8n/templates/ingress.yaml

log:
  level: debug
main:
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"
worker:
  mode: queue
  count: 3
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"
redis:
  enabled: true

webhook:
  mode: queue
  url: --placeholder--
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"

  mcp:
    extraEnvVars:
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
      N8N_RUNNERS_STDLIB_ALLOW: "calendar"

taskRunners:
  mode: external
  taskTimeout: 90
  taskHeartbeatInterval: 45

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: --placeholder--
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: n8n-tls
      hosts:
        - --placeholder--

# -- External PostgreSQL parameters
db:
  type: postgresdb

externalPostgresql:
  host: pg-af720c5-aware.j.aivencloud.com
  username: "avnadmin"
  port: 19581
  database: n8n
  existingSecret: postgres-configuration

# -- The name of an existing secret with encryption key.
existingEncryptionKeySecret: n8n-encryption-key
license:
  # -- The name of an existing secret with license activation key
  existingActivationKeySecret: n8n-license-activation-key