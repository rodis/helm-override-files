# https://github.com/community-charts/helm-charts/blob/main/charts/n8n/templates/ingress.yaml

log:
  level: debug
main:
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"
    # Execution-history retention. Pinned rather than inherited: n8n's defaults
    # (336h / 10,000 executions) are count-based, and 10,000 heavy executions
    # overflow the 1 GB Aiven plan. See tasks/n8n-execution-data-prune.
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2500"
worker:
  mode: queue
  count: 3
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"
    # Execution-history retention. Pinned rather than inherited: n8n's defaults
    # (336h / 10,000 executions) are count-based, and 10,000 heavy executions
    # overflow the 1 GB Aiven plan. See tasks/n8n-execution-data-prune.
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2500"
redis:
  enabled: true
  # Take the password from Doppler rather than letting the subchart invent one. Unset, bitnami
  # generates `requirepass` at render time -- and because `kustomize build --enable-helm` renders
  # without a cluster, its reuse-the-existing-one lookup always came back empty, so every single
  # apply rotated Redis and rolled the entire stack. See base/n8n-redis-auth.yml.
  auth:
    existingSecret: n8n-redis-auth
    existingSecretPasswordKey: redis-password

webhook:
  mode: queue
  url: --placeholder--
  extraEnvVars:
    N8N_LISTEN_ADDRESS: "0.0.0.0"
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
    N8N_RUNNERS_STDLIB_ALLOW: "calendar"
    # Execution-history retention. Pinned rather than inherited: n8n's defaults
    # (336h / 10,000 executions) are count-based, and 10,000 heavy executions
    # overflow the 1 GB Aiven plan. See tasks/n8n-execution-data-prune.
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2500"

  mcp:
    extraEnvVars:
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
      N8N_RUNNERS_STDLIB_ALLOW: "calendar"
      # Execution-history retention. Pinned rather than inherited: n8n's defaults
      # (336h / 10,000 executions) are count-based, and 10,000 heavy executions
      # overflow the 1 GB Aiven plan. See tasks/n8n-execution-data-prune.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2500"

taskRunners:
  mode: external
  taskTimeout: 90
  taskHeartbeatInterval: 45

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: --placeholder--
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: n8n-tls
      hosts:
        - --placeholder--

# -- External PostgreSQL parameters
db:
  type: postgresdb

# -- Where the n8n pods themselves read the Redis password. `redis.auth.existingSecret` above only
# tells the Redis master which secret to read; this is the client half of the same pin, and it is
# the ONLY thing this block changes -- the host still comes from the in-cluster subchart, because
# `externalRedis.existingSecret` is used for nothing but the secretKeyRef name.
externalRedis:
  existingSecret: n8n-redis-auth
  existingPasswordKey: redis-password

externalPostgresql:
  host: pg-af720c5-aware.j.aivencloud.com
  username: "avnadmin"
  port: 19581
  database: n8n
  existingSecret: postgres-configuration

# -- The name of an existing secret with encryption key.
existingEncryptionKeySecret: n8n-encryption-key
license:
  # -- The name of an existing secret with license activation key
  existingActivationKeySecret: n8n-license-activation-key