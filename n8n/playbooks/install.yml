- hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    # The lookup takes a path to kustomize and does not search PATH itself, so a hardcoded
    # /usr/bin/kustomize makes this playbook runnable only inside the execution environment.
    # That cost real time on 2026-11-24: with n8n down and AWX unwired, the one verb that could
    # have deployed the fix refused to run on a laptop over a binary path. Resolve it instead,
    # and allow -e kustomize_binary=... when a specific build is wanted.
    kustomize_binary: "{{ lookup('ansible.builtin.pipe', 'command -v kustomize || true') }}"
  tasks:
    # `context` picks the overlay. Undefined, it templates into .../overlays/ and the error names
    # the lookup plugin rather than the missing variable, which reads like a broken playbook
    # instead of a missing argument. Name the real cause here.
    - name: Refuse to run without a target overlay
      ansible.builtin.assert:
        that: context is defined
        fail_msg: >-
          `context` is not set. Pass the overlay to deploy, e.g. -e context=production
          (AWX supplies it from the job template's extra_vars).
        quiet: true

    # Checked against the filesystem rather than a hardcoded list, so adding an overlay does not
    # mean remembering to edit this guard. A typo would otherwise reach kustomize as a path.
    - name: Refuse to run against an overlay that does not exist
      ansible.builtin.assert:
        that: (playbook_dir + '/../kustomize/overlays/' + context) is directory
        fail_msg: >-
          No overlay `{{ context }}` under kustomize/overlays/. The cluster a credential points at
          and the overlay named here must agree; deploying the wrong one rewrites hostnames and
          ingress.
        quiet: true

    - name: Refuse to run without kustomize
      ansible.builtin.assert:
        that: kustomize_binary | length > 0
        fail_msg: >-
          kustomize is not on PATH. Install it, or pass -e kustomize_binary=/path/to/kustomize.
        quiet: true

    - name: Install n8n from Helm and kustomize
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('kubernetes.core.kustomize', dir=playbook_dir + '/../kustomize/overlays/' + context, binary_path=kustomize_binary, enable_helm=True) }}"
